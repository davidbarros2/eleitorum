name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime and build dependencies
        run: pip install -e ".[dev]"

      - name: Extract bare version (strip leading v)
        id: ver
        run: echo "version=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Generate icons
        run: python scripts/generate_icons.py

      - name: Build Windows artifact
        run: python scripts/build.py

      - name: Smoke test — --version
        run: |
          $proc = Start-Process "dist\EleitorUM\EleitorUM.exe" -ArgumentList "--version" -Wait -PassThru
          Write-Host "Exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) {
            Write-Error "Smoke test failed: EleitorUM.exe --version exited $($proc.ExitCode)"
            exit 1
          }
          Write-Host "Smoke test passed"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EleitorUM-${{ steps.ver.outputs.version }}-win64.zip
            EleitorUM-${{ steps.ver.outputs.version }}-win64.zip.sha256
