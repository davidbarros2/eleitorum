name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime and build dependencies
        run: pip install -e ".[dev]"

      - name: Generate icons
        run: python scripts/generate_icons.py

      - name: Build Windows artifact
        run: python scripts/build.py

      - name: Smoke test — --version
        run: |
          $output = & dist\EleitorUM\EleitorUM.exe --version 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Error "EleitorUM.exe --version exited $LASTEXITCODE"
            exit 1
          }
          if ($output -notmatch "EleitorUM 1\.0\.0") {
            Write-Error "Version mismatch: $output"
            exit 1
          }
          Write-Host "Smoke test passed: $output"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EleitorUM-1.0.0-win64.zip
            EleitorUM-1.0.0-win64.zip.sha256
